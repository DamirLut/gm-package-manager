services:
  server:
    image: ghcr.io/damirlut/gm-package-manager/server:${TAG:-latest}
    build: ./packages/server
    restart: unless-stopped
    volumes:
      - server-data:/data

  client:
    image: ghcr.io/damirlut/gm-package-manager/client:${TAG:-latest}
    build: ./packages/client
    restart: unless-stopped
    environment:
      ORIGIN: http://nginx
    depends_on:
      - server

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
      - client

volumes:
  server-data:
